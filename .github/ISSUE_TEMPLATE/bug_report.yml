name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please fill out the sections below so the issue can be reproduced.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: A minimal example. Ideally a small script plus the exact commands you ran.
      placeholder: |
        # paste minimal repro here
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Extension version / commit"
      description: "Version tag you installed, or the commit SHA you built from."
      placeholder: "v2.1 or a1b2c3d"
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Opera
        - Firefox
        - Other (specify in context)
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser version
      placeholder: "e.g. 134.0.6998.36"

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Linux / macOS / Windows + version"

  - type: textarea
    id: site
    attributes:
      label: Site or page where the bug appeared
      description: "URL or description (omit anything sensitive)."

  - type: textarea
    id: logs
    attributes:
      label: Browser console output
      description: Open DevTools → Console and paste any errors or warnings.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help.
